# Runs the offline verifiers on every push and pull request.
#
# Only the five that never open a socket run here. verify_slack.py and
# verify_pagerduty.py can post to a real channel and open a real incident, and
# verify_webhook.py, verify_writeback.py and verify_wiring.py need a running
# stack. Those five stay hand-run, and docs/verification.md records them.
#
# Every value in `env` below is a placeholder. The agent asserts its secrets at
# import time and refuses to boot without them, so they have to be present for
# the modules to load at all. Nothing here reaches a network: the URLs point at
# port 9, the discard port, so a regression that tries to send fails at once
# instead of hanging.
#
# This gate exists because verify_wiring.py silently stopped running for four
# days in August 2026 while docs/verification.md said it passed. That one needs a
# live stack and cannot run here, so this would not have caught it. The five
# below can break the same way, and now they cannot do it unnoticed.

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-verifiers:
    name: Offline verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      TRIAGE_HMAC_SECRET: "00000000000000000000000000000000"
      TRIAGE_WRITE_SECRET: "11111111111111111111111111111111"
      SPLUNK_HEC_URL: https://127.0.0.1:9/services/collector/event
      SPLUNK_HEC_TOKEN: ci-placeholder-not-a-real-token
      SPLUNK_SEARCH_URL: https://127.0.0.1:9
      SPLUNK_AGENT_PASSWORD: ci-placeholder-not-a-real-password
      OSTICKET_WRITE_URL: http://127.0.0.1:9/api/triage
      OSTICKET_BASE_URL: http://127.0.0.1:9
      ENABLE_WRITES: "true"
      SLACK_WEBHOOK_URGENT: https://127.0.0.1:9/ci
      SLACK_WEBHOOK_INCIDENTS: https://127.0.0.1:9/ci
      SLACK_WEBHOOK_REVIEW: https://127.0.0.1:9/ci
      PAGERDUTY_ROUTING_KEY_WAKE: ci-placeholder-not-a-real-key
      PAGERDUTY_ROUTING_KEY_NOTIFY: ci-placeholder-not-a-real-key

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run the offline verifiers
        run: |
          set -euo pipefail
          total=0
          for v in verify_action_table verify_idempotency verify_resume \
                   verify_recovery verify_page_reporting; do
            echo "::group::$v"
            out=$(python "agent/verification/$v.py" 2>&1) || {
              echo "$out"
              echo "::endgroup::"
              echo "::error::$v failed"
              exit 1
            }
            echo "$out"
            echo "::endgroup::"
            n=$(echo "$out" | sed -n 's/^All \([0-9]*\) checks passed.*/\1/p')
            [ -n "$n" ] || { echo "::error::$v printed no check count"; exit 1; }
            total=$((total + n))
          done
          echo "$total checks passed across 5 verifiers"
          [ "$total" -eq 107 ] || {
            echo "::error::expected 107 checks, got $total"
            exit 1
          }
