# Splunk grants a baseline capability floor to every role regardless of
# what is listed here (edit_own_objects, list_all_objects, run_collect,
# run_mcollect, schedule_rtsearch). search is not part of that floor and
# has to be granted explicitly, or the role cannot run any search at all,
# even against an index it is otherwise allowed to see.
[role_triage_enrichment]
search = enabled
srchIndexesAllowed = botsv3
srchIndexesDefault = botsv3
srchJobsQuota = 3
srchDiskQuota = 100
rtSrchJobsQuota = 0
cumulativeRTSrchJobsQuota = 0
