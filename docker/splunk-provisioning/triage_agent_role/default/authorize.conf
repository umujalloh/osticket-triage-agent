# Splunk grants every role a baseline set of capabilities (edit_own_objects,
# list_all_objects, run_collect, run_mcollect, schedule_rtsearch). The
# enrichment account runs its searches directly through the REST API and never
# saves or schedules one, so all five are turned off here. run_collect and
# run_mcollect let a search write its results into an index, edit_own_objects
# lets the account edit objects it owns, list_all_objects lets it list
# configuration settings, and schedule_rtsearch lets it schedule real-time
# searches. search is not part of that set and has to be granted explicitly,
# or the role cannot run any search at all, even against an index it is
# otherwise allowed to see.
[role_triage_enrichment]
search = enabled
run_collect = disabled
run_mcollect = disabled
edit_own_objects = disabled
list_all_objects = disabled
schedule_rtsearch = disabled
srchIndexesAllowed = botsv3
srchIndexesDefault = botsv3
srchJobsQuota = 3
srchDiskQuota = 100
rtSrchJobsQuota = 0
cumulativeRTSrchJobsQuota = 0
