# Watches the triage agent from outside it.
#
# The agent cannot report its own death, so this alerts on the absence of its
# heartbeat rather than on any event it sends. Absence is the only signal
# available: every other event in this index exists because a ticket arrived,
# and a quiet night is indistinguishable from a dead process.
#
# The window is ten minutes against a sixty second heartbeat, so ten beats have
# to be missed before this fires, and the search runs every five minutes so the
# window is always checked twice. That is deliberate slack. Splunk indexing
# latency and the edge of a search window can each swallow a beat, and an alert
# that cries wolf on a single missed one gets muted, which costs more than
# finding out five minutes later.

[Triage agent is not reporting]
search = index=osticket_triage sourcetype="osticket:triage:audit" status=heartbeat | stats count as beats
description = No heartbeat from the osTicket triage agent in the last ten minutes. The process is down, or it cannot reach this index. Tickets submitted while it is down are queued by the osTicket plugin and retried, and are given up on after an hour with a note left on the ticket.
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = custom
quantity = 0
relation = greater than
alert_condition = search beats=0
alert.severity = 4
alert.track = 1
# One alert per outage rather than one every five minutes. An agent that stays
# down would otherwise send twelve an hour, which is how an alert stops being
# read.
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1

# A detection nobody receives is not a detection, so the action ships wired
# rather than left to be added. The address is the one value that cannot be:
# override it in local/savedsearches.conf, which Splunk merges over this file
# and which this repo does not track.
#
# Splunk's own SMTP credentials are not here either. They are Splunk-wide
# settings, held in its config volume, and a password does not belong in a
# repo.
# The subject says the whole fact, so the body answers the only question left,
# which is whether this has to be dealt with now.
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage agent stopped reporting
action.email.message.alert = The triage agent has stopped reporting. Tickets are queued and retried by osTicket, and given up on after the retry window.
action.email.include.results_link = 1



# The two alerts below catch a destination that has stopped working: a routing
# key rotated, a webhook revoked, a vendor down, egress blocked. They fail on
# every attempt rather than one, and the agent keeps trying with no way to know.
#
# They are separate because a dead pager and a dead Slack channel are not
# equally urgent. A broken routing key means critical incidents reach nobody,
# and at night the channel post that says so reaches nobody either. A broken
# webhook leaves those tickets triaged and noted, and criticals still page.
#
# Neither counts failures in a window. That needs traffic this deployment does
# not have: at a few tickets a day a dead webhook might produce one failure
# today and one next week, and a threshold of three an hour would never fire on
# a destination that has been broken the whole time.
#
# What they test instead is whether anything has succeeded since. A broken
# credential fails every attempt, so two failures with no success after them is
# a fault at any volume. A blip has a success on the other side of it. That also
# makes the alert clear itself: the next successful send is more recent than the
# failures, and the condition stops being true without a suppression timer
# deciding it.
#
# The seven day window is safe only because of that recency test. It is there to
# cover destinations used rarely, not to wait before alerting, and a fault fixed
# last week drops out on its own.
#
# The failure type is reported rather than guessed. auth_failure points at the
# credential, server_down at the vendor, rate_limited clears by itself. Naming a
# likely cause in the text would send a reader to the wrong place.

[Triage paging is failing]
search = index=osticket_triage sourcetype="osticket:triage:audit" (status=page_failed OR status=paged) | eval failed=if(status="page_failed",1,0) | stats sum(failed) as failures, max(eval(if(failed=1,_time,null()))) as last_fail, max(eval(if(failed=0,_time,null()))) as last_ok, values(eval(if(failed=1,failure_type,null()))) as types by destination | where failures >= 2 AND (isnull(last_ok) OR last_fail > last_ok) | stats values(destination) as dests, values(types) as alltypes, sum(failures) as total | eval failing=mvjoin(dests, ", "), detail=mvjoin(alltypes, ", ")
description = Pages from the osTicket triage agent are failing to a destination and nothing has succeeded to it since. A PagerDuty routing key has most likely been rotated, or PagerDuty is unreachable. Critical incidents are not reaching anyone by page.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = custom
alert_condition = search total > 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage paging failing to $result.failing$
action.email.message.alert = The pages are failing with $result.detail$. Critical incidents are not paging anyone.
action.email.include.results_link = 1

[Triage Slack posts are failing]
search = index=osticket_triage sourcetype="osticket:triage:audit" (status=slack_failed OR status=slack_posted) | eval failed=if(status="slack_failed",1,0) | stats sum(failed) as failures, max(eval(if(failed=1,_time,null()))) as last_fail, max(eval(if(failed=0,_time,null()))) as last_ok, values(eval(if(failed=1,failure_type,null()))) as types by channel | where failures >= 2 AND (isnull(last_ok) OR last_fail > last_ok) | stats values(channel) as chans, values(types) as alltypes, sum(failures) as total | eval failing=mvjoin(chans, ", "), detail=mvjoin(alltypes, ", ")
description = Posts from the osTicket triage agent are failing to a channel and nothing has succeeded to it since. A Slack webhook has most likely been revoked, or Slack is unreachable. Tickets routed to that channel are being triaged with nothing announcing them.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
counttype = custom
alert_condition = search total > 0
alert.severity = 3
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage Slack posts failing to $result.failing$
action.email.message.alert = The Slack posts are failing with $result.detail$. Tickets routed to that channel are being triaged with nothing announcing them. Critical incidents still page.
action.email.include.results_link = 1
