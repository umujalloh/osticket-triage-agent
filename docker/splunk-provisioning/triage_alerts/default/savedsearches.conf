# Watches the triage agent from outside it.
#
# The agent cannot report its own death, so this alerts on the absence of its
# heartbeat rather than on any event it sends. Absence is the only signal
# available: every other event in this index exists because a ticket arrived,
# and a quiet night is indistinguishable from a dead process.
#
# The window is ten minutes against a sixty second heartbeat, so ten beats have
# to be missed before this fires, and the search runs every five minutes so the
# window is always checked twice. That is deliberate slack. Splunk indexing
# latency and the edge of a search window can each swallow a beat, and an alert
# that cries wolf on a single missed one gets muted, which costs more than
# finding out five minutes later.

[Triage agent is not reporting]
search = index=osticket_triage sourcetype="osticket:triage:audit" status=heartbeat | stats count as beats
description = No heartbeat from the osTicket triage agent in the last ten minutes. The process is down, or it cannot reach this index. Tickets submitted while it is down are queued by the osTicket plugin and retried, and are given up on after an hour with a note left on the ticket.
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = custom
quantity = 0
relation = greater than
alert_condition = search beats=0
alert.severity = 4
alert.track = 1
# One alert per outage rather than one every five minutes. An agent that stays
# down would otherwise send twelve an hour, which is how an alert stops being
# read.
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1

# A detection nobody receives is not a detection, so the action ships wired
# rather than left to be added. The address is the one value that cannot be:
# override it in local/savedsearches.conf, which Splunk merges over this file
# and which this repo does not track.
#
# Splunk's own SMTP credentials are not here either. They are Splunk-wide
# settings, held in its config volume, and a password does not belong in a
# repo.
# The subject says the whole fact, so the body answers the only question left,
# which is whether this has to be dealt with now.
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage agent stopped reporting
action.email.message.alert = The triage agent has stopped reporting. Tickets are queued and retried by osTicket, and given up on after the retry window.
action.email.include.results_link = 1

# A process that keeps crashing and being restarted still beats, so the alert
# above never fires. Every start sends one beat with an uptime of zero, so this
# counts starts. One is a deploy or a restart. Three in half an hour is a loop.
# Running the agent with --reload counts every reload as a start, so active
# development can trip it.
[Triage agent is restarting repeatedly]
search = index=osticket_triage sourcetype="osticket:triage:audit" status=heartbeat uptime_seconds=0 | stats count as starts
description = The osTicket triage agent has started three or more times in the last thirty minutes. It is crashing and being restarted, and tickets may be delayed while it does.
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = custom
alert_condition = search starts >= 3
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage agent is restarting repeatedly
action.email.message.alert = The triage agent has started $result.starts$ times in the last thirty minutes. It is crashing and being restarted.
action.email.include.results_link = 1


# The two alerts below catch a destination that has stopped working: a webhook
# revoked, a vendor down, egress blocked. They fail on every attempt, and the
# agent keeps trying with no way to know. The paging alert cannot see a dead
# PagerDuty routing key, because PagerDuty accepts the page and nothing fails.
# The last search in this file watches for that.
#
# They are separate because a dead pager and a dead Slack channel are not
# equally urgent. A routing key PagerDuty rejects means critical incidents reach
# nobody, and at night the urgent Slack channel post that says so reaches nobody
# either. A broken webhook leaves those tickets triaged and noted, and criticals
# still page.
#
# Neither alerts on a failure rate. That needs traffic this deployment does
# not have: at a few tickets a day a dead webhook might produce one failure
# today and one next week, and a threshold of three an hour would never fire on
# a destination that has been broken the whole time.
#
# What they test instead is whether anything has succeeded since. A credential
# the vendor rejects fails every attempt, so two failures with no success after
# them is a fault at any volume. A blip has a success on the other side of it.
# Only failures after the last success are counted, so an outage fixed earlier
# in the week does not make the next single blip look like a fault. That also
# makes the alert clear itself: the next successful send is more recent than the
# failures, and the condition stops being true without a suppression timer
# deciding it.
#
# The seven day window is safe only because of that recency test. It is there to
# cover destinations used rarely, not to wait before alerting, and a fault fixed
# last week drops out on its own.
#
# The failure type is reported rather than guessed. auth_failure points at the
# credential, server_down at the vendor, rate_limited clears by itself. Naming a
# likely cause in the text would send a reader to the wrong place.

[Triage paging is failing]
search = index=osticket_triage sourcetype="osticket:triage:audit" (status=page_failed OR status=paged) | eval failed=if(status="page_failed",1,0), ok_time=if(failed=0,_time,null()) | eventstats max(ok_time) as last_ok by destination | where failed=1 AND (isnull(last_ok) OR _time > last_ok) | stats count as failures, values(failure_type) as types by destination | where failures >= 2 | stats values(destination) as dests, values(types) as alltypes, sum(failures) as total | eval failing=mvjoin(dests, ", "), detail=mvjoin(alltypes, ", ")
description = Pages from the osTicket triage agent are failing to a destination and nothing has succeeded to it since. PagerDuty is unreachable or rejecting the requests. Critical incidents are not reaching anyone by page.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = custom
alert_condition = search total > 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage paging failing to $result.failing$
action.email.message.alert = The pages are failing with $result.detail$. Critical incidents are not paging anyone.
action.email.include.results_link = 1

[Triage Slack posts are failing]
search = index=osticket_triage sourcetype="osticket:triage:audit" (status=slack_failed OR status=slack_posted) | eval failed=if(status="slack_failed",1,0), ok_time=if(failed=0,_time,null()) | eventstats max(ok_time) as last_ok by channel | where failed=1 AND (isnull(last_ok) OR _time > last_ok) | stats count as failures, values(failure_type) as types by channel | where failures >= 2 | stats values(channel) as chans, values(types) as alltypes, sum(failures) as total | eval failing=mvjoin(chans, ", "), detail=mvjoin(alltypes, ", ")
description = Posts from the osTicket triage agent are failing to a channel and nothing has succeeded to it since. A Slack webhook has most likely been revoked, or Slack is unreachable. Tickets routed to that channel are being triaged with nothing announcing them.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
counttype = custom
alert_condition = search total > 0
alert.severity = 3
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.digest_mode = 1
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage Slack posts failing to $result.failing$
action.email.message.alert = The Slack posts are failing with $result.detail$. Tickets routed to that channel are being triaged with nothing announcing them. Critical incidents still page.
action.email.include.results_link = 1

# PagerDuty accepts a page whose routing key is dead and drops it, so the
# paging alert above cannot see a rotated routing key, or a PagerDuty service
# that is disabled or in maintenance. The agent checks each routing key every
# five minutes and records the result. This alerts when the latest result for
# a routing key is anything but alive, including a check that could not run, so
# revoking the REST API key cannot blind it. A stopped agent writes no checks
# and is caught by the heartbeat alert instead.
#
# Each alert gives the reason and since when the check has reported it. That
# time is the start of the latest run of results with that reason after the
# routing key was last alive, so the search looks back seven days. It still
# alerts only on a result from the last hour. It repeats the same alert at most
# once an hour, but sends a new one at once whenever the text changes, such as
# when a second routing key fails or one fails again after recovering.
# Suppressing by the detail field does that, and Splunk's
# savedsearches.conf.spec defines suppression fields for per-result alerts, so
# this search is not in digest mode like the others.
[Triage paging may reach nobody]
search = index=osticket_triage sourcetype="osticket:triage:audit" status=routing_key_checked | eval ok_time=if(result="alive",_time,null()) | eventstats max(ok_time) as last_ok by destination | where isnull(last_ok) OR _time > last_ok | sort 0 destination _time | streamstats current=f last(reason) as prev_reason by destination | eval changed=if(isnull(prev_reason) OR prev_reason!=reason, 1, 0) | streamstats sum(changed) as stretch by destination | eventstats max(stretch) as last_stretch by destination | where stretch=last_stretch | stats latest(reason) as reason, latest(_time) as last_seen, min(_time) as first_found, max(last_ok) as last_ok by destination | where last_seen >= relative_time(now(), "-1h") | eval found=if(isnull(last_ok) AND first_found < relative_time(now(), "-6d"), "The check has reported this for more than six days.", "The check has reported this since ".strftime(first_found, "%Y-%m-%d %H:%M %Z").".") | stats values(destination) as dests by reason, found | eval n=mvcount(dests), names=mvjoin(dests, " and ") | eval said=case(n>1 AND like(reason, "reaches %"), "reach ".substr(reason, 9), n>1 AND like(reason, "is on %"), "are on ".substr(reason, 7), true(), reason) | eval sentence="The ".names." routing ".if(n>1, "keys", "key")." ".said.". ".found | stats values(dests) as all_dests, values(sentence) as sentences | eval failing=mvjoin(all_dests, " and "), detail=mvjoin(sentences, " ")
description = A PagerDuty routing key the triage agent pages through no longer reaches a live PagerDuty service, or the agent cannot check it. PagerDuty accepts pages that carry a dead routing key and drops them.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = custom
alert_condition = search failing=*
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = detail
alert.digest_mode = 0
action.email = 1
action.email.to = set-this-in-local-savedsearches-conf@example.com
action.email.subject = Action needed: triage paging may reach nobody through $result.failing$
action.email.message.alert = $result.detail$ If a routing key is dead, PagerDuty accepts the pages that use it and drops them, so critical incidents may page nobody.
action.email.include.results_link = 1
