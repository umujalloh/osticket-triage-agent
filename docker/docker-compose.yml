name: osticket-triage

services:
  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - helpdesk

  osticket:
    build: 
     context: ..
     dockerfile: docker/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./ost-config.php:/var/www/html/include/ost-config.php
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # osTicket faces the internet in a real deployment and has no use for
    # Splunk, so it gets no network path to Splunk.
    networks:
      - helpdesk
  splunk:
    # Splunk 10.4.1, pinned by digest so a rebuild cannot pull a newer release
    # this stack has not been tested against. Change this line on purpose when
    # you want a different version.
    image: splunk/splunk@sha256:af4f671c9c931bfd80954e7f1baaff8540d1378ae26b098666cf05256bb24311
    restart: always
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      # Splunk's startup otherwise chowns everything under /opt/splunk to its
      # own user on every boot, including the repo folders mounted below. The
      # two things it does need, reading server.pem and writing the BOTSv3
      # app, are handed to it once in docs/setup.md.
      SPLUNK_HOME_OWNERSHIP_ENFORCEMENT: "false"
    ports:
      - "127.0.0.1:8010:8000"
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8089:8089"
    volumes:
      - splunk_data:/opt/splunk/var
      # Holds the audit index, the HEC token and the users. The image declares
      # this path a volume, so without a name here `docker compose down`
      # detaches it and the next container starts from the image's defaults.
      - splunk_etc:/opt/splunk/etc
      # BOTSv3 keeps its index inside the app, so Splunk writes to it.
      - ./splunk-apps/botsv3_data_set:/opt/splunk/etc/apps/botsv3_data_set
      # Read-only, so Splunk cannot change tracked files.
      - ./splunk-provisioning/triage_agent_role:/opt/splunk/etc/apps/triage_agent_role:ro
      - ./splunk-provisioning/custom_tls:/opt/splunk/etc/apps/custom_tls:ro
      - ./splunk-provisioning/triage_alerts:/opt/splunk/etc/apps/triage_alerts:ro
    networks:
      - siem
networks:
  helpdesk:
  siem:
volumes:
  db_data:
  splunk_data:
  splunk_etc:
